<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Página - TOUR SMA</title>
  <link rel="stylesheet" href="gerenciar_eventos.css">
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon"><i data-feather="map-pin"></i></div>
        <span class="brand-name">TOUR SMA</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <i data-feather="grid"></i>
          <span>Dashboard</span>
        </a>
<a href="dashboard.html" class="nav-item active">
            <i data-feather="edit-3"></i>
          <span>Editar Páginas</span>
        </a>
                </nav>

      <div class="user-profile">
        <div class="avatar" id="avatarInicial">A</div>
        <div class="user-info">
          <span class="user-name" id="nomeUser">Augusto</span>
          <span class="user-role">Administrador</span>
        </div>
        <button class="btn-logout" id="btnLogout" title="Sair">
          <i data-feather="log-out"></i>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <a href="dashboard.html" class="back-link">
        <i data-feather="arrow-left"></i> Voltar para a Dashboard
      </a>

      <header class="page-header">
        <h1 id="tituloPagina">Editando Página</h1>
        <p id="subtituloPagina">Atualize os textos e as imagens desta página do site.</p>
      </header>

      <div id="alertSuccess" class="alert alert-success" style="display: none;">
        <i data-feather="check-circle"></i>
        <span id="alertMessage">Alterações salvas com sucesso!</span>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>1. Textos da Página</h2>
          <span class="badge" id="badgePaginaTexto">HOME</span>
        </div>

        <form id="formTextos">
          <div class="form-group">
            <label for="tituloTexto"><i data-feather="type"></i> Título Principal:</label>
            <input type="text" id="tituloTexto" placeholder="Ex: Conheça São Miguel Arcanjo">
          </div>

          <div class="form-group">
            <label for="conteudoTexto"><i data-feather="align-left"></i> História / Descrição:</label>
            <textarea id="conteudoTexto" rows="6" placeholder="Digite o texto principal da página..."></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">
              <i data-feather="save"></i> Salvar Textos
            </button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 id="tituloBlocoImagens">2. Imagens da Página</h2>
          <button type="button" id="btnAddImagem" class="btn-secondary">
            <i data-feather="plus"></i> Adicionar Foto
          </button>
        </div>

        <form id="formImagens">
          <div id="listaCamposImagens" style="display: flex; flex-direction: column; gap: 12px;"></div>

          <div class="form-actions" style="margin-top: 16px;">
            <button type="submit" class="btn-primary">
              <i data-feather="save"></i> Salvar Imagens
            </button>
          </div>
        </form>
        <div class="card" id="blocoAgendaCalendario" style="display: none; margin-top: 24px;">
        <div class="card-header" style="flex-wrap: wrap; gap: 12px;">
          <h2>3. Eventos do Calendário</h2>
          <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <input type="date" id="dataEventoAgenda" value="2026-07-05" style="padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff;">
            <button type="button" id="btnAddEventoAgenda" class="btn-secondary">
              <i data-feather="plus"></i> Adicionar Evento
            </button>
          </div>
        </div>

        <div id="listaEventosAgenda" style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px;"></div>

        <div class="form-actions" style="margin-top: 16px;">
          <button type="button" id="btnSalvarEventosAgenda" class="btn-primary">
            <i data-feather="save"></i> Salvar Eventos do Dia
          </button>
        </div>
      </div>
      </div>
    </main>
  </div>

  <script src="editar_pagina.js"></script>
</body>
</html>
