<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOUR - Editar Página</title>
  <link rel="stylesheet" href="gerenciar_eventos.css">
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon"><i data-feather="map-pin"></i></div>
        <span class="brand-name">TOUR SMA</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <i data-feather="grid"></i>
          <span>Dashboard</span>
        </a>
        <a href="editar_pagina.html?pagina=home" class="nav-item active">
          <i data-feather="edit-3"></i>
          <span>Editar Páginas</span>
        </a>
        <a href="gerenciar_eventos.html" class="nav-item">
          <i data-feather="calendar"></i>
          <span>Agenda de Eventos</span>
        </a>
      </nav>

      <div class="user-profile">
        <div class="avatar" id="avatarInicial">A</div>
        <div class="user-info">
          <span class="user-name" id="nomeUser">Augusto</span>
          <span class="user-role">Administrador</span>
        </div>
        <button class="btn-logout" id="btnLogout" title="Sair">
          <i data-feather="log-out"></i>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <a href="dashboard.html" class="back-link">
        <i data-feather="arrow-left"></i> Voltar para a Dashboard
      </a>

      <header class="page-header">
        <h1 id="tituloPagina">Editando Página</h1>
        <p id="subtituloPagina">Atualize os textos e as imagens desta página do site.</p>
      </header>

      <div id="alertSuccess" class="alert alert-success" style="display: none;">
        <i data-feather="check-circle"></i>
        <span id="alertMessage">Alterações salvas com sucesso!</span>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>1. Textos da Página</h2>
          <span class="badge" id="badgePaginaTexto">TEXTOS</span>
        </div>

        <form id="formTextos">
          <div class="form-group">
            <label for="tituloTexto"><i data-feather="type"></i> Título Principal / Destaque:</label>
            <input type="text" id="tituloTexto" placeholder="Digite o título principal desta seção...">
          </div>

          <div class="form-group">
            <label for="conteudoTexto"><i data-feather="align-left"></i> Texto / Descrição Completa:</label>
            <textarea id="conteudoTexto" rows="5" placeholder="Digite o conteúdo de texto desta página..."></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">
              <i data-feather="save"></i> Salvar Textos
            </button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>2. Imagens / Galeria da Página</h2>
          <span class="badge" id="badgePaginaImagem">IMAGENS</span>
        </div>

        <form id="formImagens">
          <div class="form-group">
            <label for="imagem1"><i data-feather="image"></i> Imagem 1 (Principal / Banner):</label>
            <input type="text" id="imagem1" placeholder="Ex: assets/img/foto1.jpg ou URL da imagem">
          </div>

          <div class="form-group">
            <label for="imagem2"><i data-feather="image"></i> Imagem 2 (Galeria / Destaque):</label>
            <input type="text" id="imagem2" placeholder="Ex: assets/img/foto2.jpg ou URL da imagem">
          </div>

          <div class="form-group">
            <label for="imagem3"><i data-feather="image"></i> Imagem 3 (Galeria / Destaque):</label>
            <input type="text" id="imagem3" placeholder="Ex: assets/img/foto3.jpg ou URL da imagem">
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">
              <i data-feather="save"></i> Salvar Imagens
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="editar_pagina.js"></script>
</body>
</html>
