<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TOUR - Login Administrativo</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class", 
      theme: {
        extend: {
          colors: {
            "tour-green": "#29763B",
            "tour-blue": "#194C9B",
            "tour-white": "#FFFFFF",
            "tour-black": "#121613",
            "tour-dark-gray": "#333333",
            "tour-gray": "#666666",
            "tour-error": "#ef4444", 
          },
          fontFamily: {
            "display": ["Plus Jakarta Sans", "sans-serif"] 
          },
          borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
        },
      },
    }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24 }
  .spinner { border: 3px solid rgba(25,76,155,0.3); border-radius: 50%; border-top: 3px solid #194C9B; width: 20px; height: 20px; animation: spin 1s linear infinite; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>

<body class="font-display bg-tour-white text-tour-black">
  <div class="relative flex h-auto min-h-screen w-full flex-col items-center justify-center p-4">
    <div class="layout-container flex h-full grow flex-col justify-center w-full max-w-md">
      
      <div class="flex flex-col items-center justify-center gap-8 rounded-xl bg-white p-8 shadow-xl">
        <div class="flex flex-col items-center gap-2 text-center">
          <div class="h-16 w-16 mb-4 flex items-center justify-center bg-tour-green rounded-xl text-tour-white">
             <span class="material-symbols-outlined text-4xl">travel_explore</span>
          </div>
          <p class="text-tour-black tracking-light text-[32px] font-bold leading-tight">Painel Administrativo</p>
          <p class="text-tour-gray">Insira suas credenciais de administrador.</p>
        </div>

        <form id="loginForm" class="layout-content-container flex flex-col w-full gap-6">
          
          <div id="errorMessage" class="hidden bg-tour-error/10 border border-tour-error text-tour-error px-4 py-3 rounded-lg text-sm text-center"></div>

          <div class="flex flex-col gap-4">
            <label class="flex flex-col w-full flex-1">
              <p class="text-tour-black text-base font-medium leading-normal pb-2">E-mail</p>
              <div class="flex w-full flex-1 items-stretch rounded-lg">
                <input id="email" required
                  class="form-input flex w-full rounded-lg text-tour-black bg-tour-white border border-gray-300 focus:outline-0 focus:ring-2 focus:ring-tour-blue focus:border-tour-blue h-12 p-[15px]" 
                  placeholder="augusto@toursaomiguel.com.br" type="email"
                />
              </div>
            </label>

            <label class="flex flex-col w-full flex-1">
              <p class="text-tour-black text-base font-medium leading-normal pb-2">Senha</p>
              <div class="flex w-full flex-1 items-stretch rounded-lg group">
                <input id="password" required
                  class="form-input flex w-full rounded-l-lg text-tour-black bg-tour-white border border-r-0 border-gray-300 focus:outline-0 focus:ring-2 focus:ring-inset focus:ring-tour-blue focus:border-tour-blue h-12 p-[15px]" 
                  placeholder="••••••••" type="password"
                />
                <div class="text-tour-gray flex border border-l-0 border-gray-300 bg-tour-white items-center justify-center pr-[15px] rounded-r-lg group-focus-within:ring-2 group-focus-within:ring-inset group-focus-within:ring-tour-blue group-focus-within:border-tour-blue">
                  <span id="togglePass" class="material-symbols-outlined cursor-pointer hover:text-tour-blue">visibility</span>
                </div>
              </div>
            </label>
          </div>

          <div class="flex pt-4 justify-center">
            <button type="submit" id="btnSubmit" class="flex w-full cursor-pointer items-center justify-center rounded-lg h-12 bg-tour-green hover:bg-[#226331] transition-colors font-bold text-tour-white shadow-lg shadow-tour-green/20">
              <span id="btnText">Entrar</span>
              <div id="btnLoader" class="spinner hidden"></div>
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const btnLoader = document.getElementById('btnLoader');
    const BASE_URL = ''; 

    document.getElementById('togglePass').addEventListener('click', function() {
        const input = document.getElementById('password');
        const icon = this;
        if (input.type === "password") {
            input.type = "text";
            icon.innerText = "visibility_off";
        } else {
            input.type = "password";
            icon.innerText = "visibility";
        }
    });

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        errorMessage.classList.add('hidden');
        btnSubmit.disabled = true;
        btnText.classList.add('hidden');
        btnLoader.classList.remove('hidden');

        const email = document.getElementById('email').value;
        const senha = document.getElementById('password').value;

if (
  email === "augusto@toursaomiguel.com" &&
  senha === "Tour@2025"
) {
  localStorage.setItem("tour_token", "logado");
  localStorage.setItem("tour_user_name", "Augusto");
  window.location.href = "dashboard.html";
} else {
  errorMessage.textContent = "E-mail ou senha inválidos";
  errorMessage.classList.remove("hidden");
}

    });
  </script>
</body>
</html>
