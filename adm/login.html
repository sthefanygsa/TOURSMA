<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOUR - Painel Administrativo</title>
  <link rel="stylesheet" href="login.css" />
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

  <main class="login-container">
    <div class="login-card">
      
      <div class="logo-box">
        <i data-feather="map-pin"></i>
      </div>

      <h1>Painel Administrativo</h1>
      <p class="subtitle">Bem-vindo(a) de volta! Insira suas credenciais.</p>

      <form id="loginForm">
        
        <div class="form-group">
          <label for="email">E-mail</label>
          <input 
            type="email" 
            id="email" 
            placeholder="seuemail@exemplo.com" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <div class="input-password-wrapper">
            <input 
              type="password" 
              id="password" 
              placeholder="••••••••" 
              required 
            />
            <button type="button" id="togglePassword" class="btn-toggle-password" aria-label="Mostrar ou ocultar senha">
              <i data-feather="eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit">Entrar</button>

      </form>

    </div>
  </main>

  <script>
  feather.replace();

  const togglePassword = document.querySelector('#togglePassword');
  const passwordInput = document.querySelector('#password');
  const eyeIcon = document.querySelector('#eyeIcon');

  togglePassword.addEventListener('click', function () {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    
    if (type === 'text') {
      eyeIcon.setAttribute('data-feather', 'eye-off');
    } else {
      eyeIcon.setAttribute('data-feather', 'eye');
    }
    feather.replace();
  });

  const USER_PADRAO = "admin@toursma.com.br";
  const SENHA_PADRAO = "123456";

  const loginForm = document.querySelector('#loginForm');

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault(); 

    const emailDigitado = document.querySelector('#email').value.trim();
    const senhaDigitada = passwordInput.value.trim();

    if (emailDigitado === USER_PADRAO && senhaDigitada === SENHA_PADRAO) {
      localStorage.setItem('usuarioLogado', 'true');
      localStorage.setItem('nomeUsuario', 'Augusto');

      window.location.href = 'dashboard.html';
    } else {
      alert('E-mail ou senha incorretos! Tente novamente.\n\nCredenciais de teste:\nE-mail: admin@toursma.com.br\nSenha: 123456');
    }
  });
</script>
</body>
</html>
